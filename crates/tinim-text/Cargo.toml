[package]
name = "tinim-text"
description = "Text shaping, layout and glyph rasterization for tinim-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
glam.workspace = true

# Font parsing/scaling/color/bitmaps and OpenType shaping. The versions are pinned to the same
# fontations generation so that only one copy of read-fonts/font-types is compiled.
harfrust = { version = "0.5.2", default-features = false, features = ["std"] }
skrifa = { version = "0.40", default-features = false, features = ["std"] }

unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"

# Outline rasterization. This is a small, focused crate and keeps us from having to write a
# scanline rasterizer.
ab_glyph_rasterizer = "0.1"

# Optional because not every user needs bitmap color fonts (CBDT/CBLC, sbix).
png = { workspace = true, optional = true }

# Optional: keep system font files memory-mapped instead of reading them into the heap.
memmap2 = { workspace = true, optional = true }

[features]
default = ["fallback", "emoji-bitmap"]
fallback = []
system-fonts = ["dep:memmap2"]
emoji-bitmap = ["dep:png"]

[dev-dependencies]
criterion = "0.8"
font-test-data = "0.10"

[[bench]]
name = "text"
harness = false
