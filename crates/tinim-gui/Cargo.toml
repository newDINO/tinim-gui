[package]
name = "tinim-gui"
description = "Immediate-mode GUI on top of tinim-paint, tinim-text and tinim-paint-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tinim-paint.workspace = true
tinim-paint-text.workspace = true
tinim-text.workspace = true
rustc-hash = { workspace = true, optional = true }
unicode-segmentation = "1"

[features]
default = ["rustc-hash"]
rustc-hash = ["dep:rustc-hash"]

[dev-dependencies]
font-test-data = "0.10"
