[package]
name = "tinim-demo-native"
description = "Native winit + wgpu demo for tinim-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tinim-demo-native"
path = "src/main.rs"

[dependencies]
env_logger.workspace = true
tinim-demo.workspace = true

[features]
# Forward to tinim-demo, which forwards to tinim-winit.
wayland = ["tinim-demo/wayland"]
wayland-dlopen = ["tinim-demo/wayland-dlopen"]
