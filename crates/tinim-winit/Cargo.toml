[package]
name = "tinim-winit"
description = "winit input, output and clipboard integration for tinim-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
tinim-gui.workspace = true
web-time = "1"
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
copypasta = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Navigator",
    "Window",
], optional = true }

[features]
# System clipboard access: copypasta on native targets, the browser Clipboard API on wasm.
# Applications that handle copy/paste themselves can leave this disabled.
#
# On Linux this needs a backend feature as well: `x11` enables copypasta's X11 backend and
# `wayland` enables its Wayland backend. Without one, `Clipboard` still exists but reads and
# writes are no-ops.
clipboard = [
    "dep:copypasta",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# Enable winit's X11 backend on Linux. `winit` needs at least one platform backend to
# compile, so this is on by default to keep `cargo check` and `cargo doc` working for this
# crate without extra flags. Applications that depend on winit themselves (with its default
# features) are unaffected. Disable this feature if you select winit's backend yourself.
default = ["x11", "rwh_06"]
# Forwarding through `copypasta?/x11` keeps copypasta's Wayland backend out of X11-only
# builds; copypasta's default features enable both.
x11 = ["winit/x11", "copypasta?/x11"]
# Enable winit's Wayland backend and copypasta's Wayland clipboard. `rwh_06` supplies the
# window's raw display handle, which the Wayland clipboard needs.
wayland = ["winit/wayland", "copypasta?/wayland", "rwh_06"]
# Load Wayland libraries at runtime instead of linking them. Implies `wayland`.
wayland-dlopen = ["wayland", "winit/wayland-dlopen", "copypasta?/wayland-dlopen"]
# Let native applications create a wgpu surface from a winit window.
rwh_06 = ["winit/rwh_06"]
