[package]
name = "tinim-winit"
description = "winit input adapter for tinim-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tinim-gui.workspace = true
winit.workspace = true

[dev-dependencies]
pollster.workspace = true
tinim-text = { workspace = true, features = ["system-fonts"] }
tinim-wgpu.workspace = true

[features]
# When using `cargo check` or `cargo doc` on linux, winit can't compile when no feature is enabled.
# This is a workaround so that when using `cargo check --all-features`, winit can pass compilation.
to-pass-cargo-check = ["winit/x11"]
