[package]
name = "tinim-demo-web"
description = "WebAssembly demo for tinim-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log.workspace = true
log.workspace = true
tinim-demo.workspace = true
tinim-gui.workspace = true
tinim-wgpu.workspace = true
tinim-winit = { workspace = true, default-features = false, features = ["clipboard"] }
# Enable WebGL output for browsers that do not provide WebGPU.
wgpu = { workspace = true, features = ["webgl"] }

console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
