[package]
name = "tinim-demo-web"
description = "WebAssembly demo for tinim-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
tinim-demo.workspace = true
tinim-gui.workspace = true
tinim-wgpu = { workspace = true, features = ["webgl"] }
tinim-winit = { workspace = true, default-features = false }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "console"] }
