<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tinim-gui web demo</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #121216;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="tinim-canvas"></canvas>
    <script type="module">
      import init from "./pkg/tinim_demo_web.js";

      init().catch((error) => {
        console.error(error);
        document.body.textContent = `Failed to start the demo: ${error}`;
      });
    </script>
  </body>
</html>
