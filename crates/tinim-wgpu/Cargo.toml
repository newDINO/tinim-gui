[package]
name = "tinim-wgpu"
description = "wgpu renderer for tinim-gui paint data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tinim-paint.workspace = true
wgpu.workspace = true
bytemuck.workspace = true

[features]
# Enable wgpu's WebGL backend for browsers without WebGPU.
webgl = ["wgpu/webgl"]

[dev-dependencies]
pollster.workspace = true
png.workspace = true
winit = { workspace = true, features = ["rwh_06", "x11"] }
tinim-text = { workspace = true, features = ["system-fonts"] }
font-test-data = "0.10"
