[workspace]
resolver = "3"
members = ["crates/tinim-paint", "crates/tinim-wgpu"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = "0.34.1"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19.0"
wgpu = "30.0.1"
pollster = "1.0"
png = "0.18"
tinim-paint = { path = "crates/tinim-paint" }
