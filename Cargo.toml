[workspace]
resolver = "3"
members = [
    "crates/tinim-paint",
    "crates/tinim-text",
    "crates/tinim-paint-text",
    "crates/tinim-wgpu",
    "crates/tinim-gui",
    "crates/tinim-winit",
    "crates/tinim-demo",
    "crates/tinim-demo-native",
    "crates/tinim-demo-web",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
rustc-hash = "2"
wgpu = "30"
winit = { version = "0.30", default-features = false }

tinim-paint = { path = "crates/tinim-paint" }
tinim-text = { path = "crates/tinim-text" }
tinim-paint-text = { path = "crates/tinim-paint-text" }
tinim-wgpu = { path = "crates/tinim-wgpu" }
tinim-gui = { path = "crates/tinim-gui" }
tinim-winit = { path = "crates/tinim-winit" }
tinim-demo = { path = "crates/tinim-demo" }

# Versions shared across crates. `pollster` and `winit` are used by the demo crates and
# `tinim-wgpu`'s examples; `png` is also the optional decoder behind tinim-text's
# `emoji-bitmap` feature, and `memmap2` backs its optional `system-fonts` feature.
pollster = "1.0"
png = "0.18"
memmap2 = "0.9"

[profile.dev]
debug = false
