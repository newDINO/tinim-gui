[workspace]
resolver = "3"
members = ["crates/tinim-paint", "crates/tinim-text", "crates/tinim-wgpu"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = { version = "0.30" }

tinim-paint = { path = "crates/tinim-paint" }
tinim-text = { path = "crates/tinim-text" }

# Versions shared across crates. `pollster` and `winit` are only used by tinim-wgpu's examples;
# `png` is also the optional decoder behind tinim-text's `emoji-bitmap` feature, and `memmap2`
# backs its optional `system-fonts` feature.
pollster = "1.0"
png = "0.18"
memmap2 = "0.9.12"

[profile.dev]
debug = false
